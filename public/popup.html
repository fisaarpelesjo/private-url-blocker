<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Blocker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-shell">
    <main class="app-panel compact">
      <header class="topbar">
        <div>
          <h1>URL Blocker</h1>
          <p><span id="item-count">0</span> itens bloqueados</p>
        </div>
      </header>

      <section class="current-site">
        <div>
          <span>Pagina atual</span>
          <strong id="current-domain">Nao detectada</strong>
        </div>
        <button id="block-current-button" type="button" disabled>Bloquear</button>
      </section>

      <form id="add-form" class="entry-form">
        <label for="block-input">Dominio ou URL</label>
        <div class="input-row">
          <input id="block-input" type="text" autocomplete="off" placeholder="instagram.com">
          <button type="submit">Adicionar</button>
        </div>
      </form>

      <label for="search-input">Pesquisar</label>
      <input id="search-input" type="search" autocomplete="off" placeholder="insta">

      <div id="message" class="message" role="status"></div>
      <ul id="block-list" class="rule-list"></ul>
    </main>
    <script src="popup/popup.js"></script>
  </body>
</html>
